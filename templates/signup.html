<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c0e14">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <title>Create account — {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="logo-mark auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0b0c18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M20 8V5a1 1 0 0 0-1-1h-3"/>
                <path d="M4 16v3a1 1 0 0 0 1 1h3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </div>
        <h1 class="auth-title">{{ app_name }}</h1>
        <p class="auth-subtitle">Create an account to keep your known people permanently.</p>

        <div id="auth-status" class="auth-status" hidden></div>

        <form id="auth-form" class="auth-form" data-mode="signup">
            <input type="email" id="auth-email" placeholder="Email address" autocomplete="email" required autofocus>
            <input type="password" id="auth-password" placeholder="Password (min. 6 characters)" autocomplete="new-password" minlength="6" required>
            <input type="password" id="auth-confirm" placeholder="Confirm password" autocomplete="new-password" minlength="6" required>
            <button type="submit">Create account</button>
        </form>

        <button type="button" class="google-auth-btn" id="google-signin-btn">
            <span class="google-g">G</span> Continue with Google
        </button>

        <p class="auth-guest-note">Already using FaceTally as a guest? After you create your account, you can import your temporary saved faces.</p>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        <p class="auth-switch"><a href="{{ url_for('index') }}">Continue without logging in</a></p>
    </div>
</div>
<script type="module" src="{{ url_for('static', filename='firebase-auth.js') }}"></script>
</body>
</html>
